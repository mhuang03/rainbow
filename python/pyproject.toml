[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "rainbow-engine"
description = "Python bindings for the Rainbow card game engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest"]
train = ["torch>=2.0"]
gym = ["gymnasium>=1.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
